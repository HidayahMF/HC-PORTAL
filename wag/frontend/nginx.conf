# Nginx untuk SPA WAG + reverse proxy API.
# VITE_API_BASE_URL=/api (relatif) → browser same-origin, bebas masalah CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: semua rute non-file → index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api → service backend (jaringan Docker).
    # Resolver Docker + variabel agar nginx tidak gagal start bila backend
    # belum siap saat container frontend naik (depends_on hanya urutan start).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api {
        set $backend_upstream http://backend:5002;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Body JSON 10MB + upload lampiran 16MB (default nginx cuma 1MB → 413).
        client_max_body_size 25m;

        # Broadcast/test-send sinkron bisa lama; jangan dipotong prematur.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
