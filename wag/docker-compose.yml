services:

  frontend:
    build:
      context: ./frontend
    container_name: react-frontend
    ports:
      - "3002:80"
    depends_on:
      - backend
    restart: always
    healthcheck:
      # Liveness nginx: halaman SPA harus tersaji.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: express-backend
    ports:
      - "5002:5002"
    healthcheck:
      # Liveness proses: /api/health merespons (200 atau 503 = hidup;
      # status DB/gateway ada di body, TIDAK memicu restart berantai).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5002/api/health').then(r => { if (r.status === 200 || r.status === 503) process.exit(0); process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    volumes:
      # Share SMB untuk media WhatsApp gateway.
      - ${WAGW_SMB_MOUNT:-/mnt/wagw}:/mnt/wagw
      # Lampiran pesan terjadwal — persisten antar recreate container.
      - wagw_uploads:/app/uploads

    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5002
      TZ: Asia/Jakarta

      # SQL Server
      DB_SERVER: ${DB_SERVER:?DB_SERVER wajib diisi di .env compose}
      DB_DATABASE: ${DB_DATABASE:-BMC}
      DB_USER: ${DB_USER:?DB_USER wajib diisi di .env compose}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env compose}
      DB_ENCRYPT: ${DB_ENCRYPT:-false}
      DB_TRUST_SERVER_CERT: ${DB_TRUST_SERVER_CERT:-true}

      # MySQL
      MYSQL_HOST: ${MYSQL_HOST:?MYSQL_HOST wajib diisi di .env compose}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER wajib diisi di .env compose}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD wajib diisi di .env compose}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pw2}

      # JWT & whitelist
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi di .env compose}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ALLOWED_NIPS: ${ALLOWED_NIPS:?ALLOWED_NIPS wajib diisi di .env compose}
      ALLOWED_ADMIN_NIPS: ${ALLOWED_ADMIN_NIPS:-}
      ALLOWED_VIEWER_NIPS: ${ALLOWED_VIEWER_NIPS:-}

      # WhatsApp Gateway
      WA_API: ${WA_API:?WA_API wajib diisi di .env compose}
      WAGW_API: ${WAGW_API:?WAGW_API wajib diisi di .env compose}
      WAGW_FILE_DIR: ${WAGW_FILE_DIR:?WAGW_FILE_DIR wajib diisi di .env compose}
      WAGW_SMB_MOUNT: ${WAGW_SMB_MOUNT:-/mnt/wagw}

      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN wajib diisi di .env compose}

    restart: always

volumes:
  wagw_uploads:
