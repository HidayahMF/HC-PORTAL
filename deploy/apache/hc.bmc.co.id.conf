<VirtualHost *:443>
    ServerName hc.bmc.co.id
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/hc.bmc.co.id/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hc.bmc.co.id/privkey.pem
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:3011/
    ProxyPassReverse / http://127.0.0.1:3011/
</VirtualHost>
