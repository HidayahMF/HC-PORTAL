name: hc-portal
services:
  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    ports: ["3000:80"]
    depends_on: [backend]
    restart: unless-stopped
  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    expose: ["3000"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_SERVER: ${DB_SERVER:?DB_SERVER is required}
      DB_PORT: ${DB_PORT:-1433}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_ENCRYPT: ${DB_ENCRYPT:-false}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-}
      ALLOWED_NIPS: ${ALLOWED_NIPS:?ALLOWED_NIPS is required}
      ALLOWED_ADMIN_NIPS: ${ALLOWED_ADMIN_NIPS:-}
      ALLOWED_VIEWER_NIPS: ${ALLOWED_VIEWER_NIPS:-}
      WA_API: ${WA_API:?WA_API is required}
      WAGW_API: ${WAGW_API:-}
      WAGW_FILE_DIR: ${WAGW_FILE_DIR:-}
      WAGW_SMB_MOUNT: ${WAGW_SMB_MOUNT:-/mnt/wagw}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://hc.bmc.co.id}
    volumes:
      - wagw_uploads:/app/src/modules/wag/runtime/uploads
      - ${WAGW_SMB_MOUNT:-/mnt/wagw}:/mnt/wagw
    restart: unless-stopped

volumes:
  wagw_uploads:
