name: hc-portal
services:
  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    ports: ["3000:80"]
    depends_on: [backend]
    restart: unless-stopped
  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    expose: ["3000"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_SERVER: ${DB_SERVER:?DB_SERVER is required}
      DB_PORT: ${DB_PORT:-1433}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_ENCRYPT: ${DB_ENCRYPT:-false}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-}
    restart: unless-stopped
